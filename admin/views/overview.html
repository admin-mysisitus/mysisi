<div class="admin-page-header">
  <div>
    <h1 class="admin-page-title">Dashboard Overview</h1>
    <p class="admin-page-desc">Ringkasan performa sistem SISITUS hari ini.</p>
  </div>
  <div>
    <button class="admin-btn" id="refresh-stats">
      <i class="fas fa-sync-alt"></i> Refresh Data </button>
  </div>
</div>
<div class="admin-metrics-grid-compact">
  <div class="admin-metric-card admin-metric-card--info">
    <div class="admin-metric-card__body">
      <div>
        <div class="admin-metric-card__value" id="stat-users">-</div>
        <div class="admin-metric-card__label">Total Pengguna</div>
      </div>
      <div class="admin-metric-card__icon">
        <i class="fas fa-users"></i>
      </div>
    </div>
    <div class="admin-metric-card__trend admin-metric-card__trend--up">
      <i class="fas fa-arrow-up"></i> 12% bln lalu
    </div>
  </div>
  <div class="admin-metric-card admin-metric-card--success">
    <div class="admin-metric-card__body">
      <div>
        <div class="admin-metric-card__value" id="stat-revenue">-</div>
        <div class="admin-metric-card__label">Pendapatan (MRR)</div>
      </div>
      <div class="admin-metric-card__icon">
        <i class="fas fa-rupiah-sign"></i>
      </div>
    </div>
    <div class="admin-metric-card__trend admin-metric-card__trend--up">
      <i class="fas fa-arrow-up"></i> 8.5% bln lalu
    </div>
  </div>
  <div class="admin-metric-card admin-metric-card--primary">
    <div class="admin-metric-card__body">
      <div>
        <div class="admin-metric-card__value" id="stat-subs">-</div>
        <div class="admin-metric-card__label">Langganan Aktif</div>
      </div>
      <div class="admin-metric-card__icon">
        <i class="fas fa-box-open"></i>
      </div>
    </div>
    <div class="admin-metric-card__trend admin-metric-card__trend--neutral"> Sesuai target </div>
  </div>
  <div class="admin-metric-card admin-metric-card--warning">
    <div class="admin-metric-card__body">
      <div>
        <div class="admin-metric-card__value" id="stat-tickets">-</div>
        <div class="admin-metric-card__label">Tiket Support</div>
      </div>
      <div class="admin-metric-card__icon">
        <i class="fas fa-headset"></i>
      </div>
    </div>
    <div class="admin-metric-card__trend admin-metric-card__trend--down">
      <i class="fas fa-exclamation-circle"></i> 5 butuh balasan
    </div>
  </div>
</div>
<div class="admin-layout-grid-2">
  <div class="admin-card">
    <h3 style="margin: 0 0 20px 0; font-family: var(--font-admin-heading);">Grafik Pendaftaran Baru</h3>
    <div style="height: 300px; position: relative; width: 100%;">
      <canvas id="registration-chart"></canvas>
    </div>
  </div>
  <div class="admin-card">
    <h3 style="margin: 0 0 20px 0; font-family: var(--font-admin-heading);">Aktivitas Terbaru</h3>
    <div style="display: flex; flex-direction: column; gap: 16px;" id="recent-activities">
      <div style="display: flex; justify-content: center; padding: 20px 0;">
        <i class="fas fa-spinner fa-spin" style="color: var(--admin-text-muted);"></i>
      </div>
    </div>
  </div>
</div>
