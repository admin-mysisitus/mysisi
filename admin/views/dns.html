<div class="admin-page-header">
  <div>
    <h1 class="admin-page-title">Manajemen DNS</h1>
    <p class="admin-page-desc">Pantau dan kelola DNS Records dari domain pelanggan.</p>
  </div>
  <div class="admin-actions">
    <button class="admin-btn" id="btn-add-dns">
      <i class="fas fa-plus"></i> Tambah DNS </button>
  </div>
</div>
<div class="admin-card">
  <div class="admin-toolbar">
    <div class="admin-search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="search-dns" class="admin-input-control" placeholder="Cari domain...">
    </div>
  </div>
  <div class="admin-table-container">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Domain</th>
          <th>Pemilik</th>
          <th>Total Records</th>
          <th>Status Nameserver</th>
          <th style="text-align: right;">Aksi</th>
        </tr>
      </thead>
      <tbody id="dns-table-body">
        <!-- Injected via JS -->
      </tbody>
    </table>
  </div>
</div>
<!-- Modal Form DNS -->
<div id="dns-modal" class="admin-modal">
  <div class="admin-card admin-modal-content">
    <h3 id="dns-modal-title" class="admin-section-title">Tambah DNS Manual</h3>
    <form id="dns-form">
      <div class="admin-form-group">
        <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">Nama Domain</label>
        <input type="text" id="dns-domain" required class="admin-input-control">
      </div>
      <div class="admin-form-group">
        <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">Email Pemilik / User ID</label>
        <input type="text" id="dns-user" required class="admin-input-control">
      </div>
      <div class="admin-form-grid-2" style="margin-bottom: 24px;">
        <div>
          <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">Total Records</label>
          <input type="number" id="dns-records" min="0" value="0" required class="admin-input-control">
        </div>
        <div>
          <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">Status Nameserver</label>
          <select id="dns-status" class="admin-input-control">
            <option value="pending">Pending</option>
            <option value="pointed">Pointed (Aktif)</option>
            <option value="error">Error</option>
          </select>
        </div>
      </div>
      <div class="admin-actions" style="justify-content: flex-end;">
        <button type="button" id="btn-close-dns" class="admin-btn" style="background: transparent; border: 1px solid var(--admin-border); color: var(--admin-text-main);">Batal</button>
        <button type="submit" id="btn-save-dns" class="admin-btn"><i class="fas fa-save"></i> Simpan</button>
      </div>
    </form>
  </div>
</div>
