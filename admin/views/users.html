<div class="admin-page-header">
<div>
<h1 class="admin-page-title">Manajemen Users</h1>
<p class="admin-page-desc">Kelola profil akun pelanggan dan status hak akses.</p>
</div>
</div>
<div class="admin-card">
<div class="admin-toolbar">
<div class="admin-search-box">
<i class="ph ph-magnifying-glass"></i>
<input type="text" id="search-users" placeholder="Cari nama atau email...">
</div>
<div class="admin-filter-group">
<select id="filter-user-status" class="admin-filter-select">
<option value="all">Semua Status</option>
<option value="active">Aktif</option>
<option value="suspended">Suspended</option>
</select>
</div>
</div>
<div class="admin-table-container">
<table class="admin-table">
<thead>
<tr>
<th>User Info</th>
<th class="nowrap">Role</th>
<th class="nowrap">Status</th>
<th class="nowrap">Bergabung</th>
<th class="text-right nowrap">Aksi</th>
</tr>
</thead>
<tbody id="users-table-body">
</tbody>
</table>
</div>
<div class="admin-pagination">
<p id="users-count" class="admin-pagination-text">Menampilkan 0 user</p>
</div>
</div>
<div id="user-modal" class="admin-modal">
<div class="admin-modal-content">
<h3 id="user-modal-title" class="admin-page-title">Edit Profil User</h3>
<form id="user-form">
<input type="hidden" id="usr-id">
<div class="admin-form-group">
<label class="admin-form-label">Nama Lengkap</label>
<input type="text" id="usr-name" required class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Email</label>
<input type="email" id="usr-email" required class="admin-input-control">
</div>
<div class="admin-form-grid-2">
<div class="admin-form-group">
<label class="admin-form-label">WhatsApp</label>
<input type="text" id="usr-wa" class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Role</label>
<select id="usr-role" class="admin-input-control">
<option value="customer">Customer</option>
<option value="admin">Admin</option>
</select>
</div>
</div>
<div class="admin-form-group">
<div class="admin-actions">
<label class="checkbox-label">
<input type="checkbox" id="usr-active" checked>
<span>Akun Aktif</span>
</label>
<label class="checkbox-label">
<input type="checkbox" id="usr-verified" checked>
<span>Email Verified</span>
</label>
</div>
</div>
<div class="admin-actions flex-end">
<button type="button" id="btn-close-user" class="admin-btn btn-secondary">Batal</button>
<button type="submit" id="btn-save-user" class="admin-btn"><i class="ph ph-floppy-disk"></i> Simpan</button>
</div>
</form>
</div>
</div>
