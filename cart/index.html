<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Saya - SISITUS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico?v=1.0.0">
  <link rel="manifest" href="/assets/favicon/site.webmanifest?v=1.0.0">
  <link rel="stylesheet" href="/assets/css/main.css?v=1.0.0">
  <link rel="stylesheet" href="/assets/css/components/auth.css?v=1.0.0">
  <link rel="stylesheet" href="/assets/css/pages/cart.css?v=1.0.0">
  <link media="print" onload="this.media='all'" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="checkout-page-body">
  <header aria-label="Navigasi Utama">
    <div class="container nav-container">
      <a href="/" class="logo" aria-label="Kembali ke Beranda sisitus.com">
        <div class="logo-img">
          <img src="/assets/img/logo/logo512x512.webp?v=1.0.0" alt="Logo sisitus.com" width="512" height="512">
        </div>
        <div class="logo-text">
          <span>sisitus.com</span>
          <p>Solusi Digital Web Profesional</p>
        </div>
      </a>
      <nav class="nav-desktop" aria-label="Navigasi Desktop"></nav>
      <button class="nav-mobile-btn" id="nav-mobile-btn" aria-label="Buka/Tutup Menu Mobile" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-mobile" id="nav-mobile" aria-label="Navigasi Mobile" aria-hidden="true"></nav>
    </div>
  </header>
  <div id="cart-container" class="page-container" style="padding: 0 16px; padding-top: 40px; overflow-x: hidden;"></div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="/assets/js/components/navigation.js?v=1.0.1"></script>
  <script type="module">
    import { AuthManager } from '/assets/js/modules/unified-auth.js';
    import { EnvHelper } from '/assets/js/modules/unified-utils.js';
    import { render } from '/assets/js/modules/cart.js?v=20260823_1550';
    
    document.addEventListener('DOMContentLoaded', () => {
      // Force load session synchronously just in case
      AuthManager.loadSession();
      const currentUser = AuthManager.getCurrentUser();
      
      if (currentUser) {
        // Authenticated users should use the dashboard cart
        window.location.replace(EnvHelper.getDomainUrl('my', '/dashboard/#!/dashboard/keranjang'));
      } else {
        // Call render function with null for guest checkout
        render(null);
      }
    });
  </script>
</body>

</html>
