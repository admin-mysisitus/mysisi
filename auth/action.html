<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memproses Permintaan - SISITUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/index.css">
    <style>
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(79, 70, 229, 0.2);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; }
        p { color: var(--text-muted); margin: 0; }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <h2>Memproses...</h2>
        <p>Mohon tunggu sebentar, Anda sedang dialihkan.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ambil parameter dari URL (mode dan oobCode) yang dikirim oleh Firebase
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const oobCode = urlParams.get('oobCode');
            const continueUrl = urlParams.get('continueUrl');
            
            // Siapkan parameter untuk diteruskan ke halaman tujuan
            let params = `?oobCode=${encodeURIComponent(oobCode || '')}`;
            if (continueUrl) {
                params += `&continueUrl=${encodeURIComponent(continueUrl)}`;
            }

            // Arahkan ke halaman custom yang sudah Anda buat sebelumnya berdasarkan mode
            switch (mode) {
                case 'resetPassword':
                    window.location.replace('/auth/reset-password.html' + params);
                    break;
                case 'verifyEmail':
                    window.location.replace('/auth/verify-email.html' + params);
                    break;
                case 'recoverEmail':
                    // Opsional: Jika ingin menangani pemulihan email (pembatalan ganti email)
                    window.location.replace('/auth/index.html?message=email_recovered');
                    break;
                default:
                    // Jika tidak dikenali atau kosong, arahkan ke halaman login
                    window.location.replace('/auth/index.html');
            }
        });
    </script>
</body>
</html>
