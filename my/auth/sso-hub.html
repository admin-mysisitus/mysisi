<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>SSO Hub</title>
  <!-- Sembunyikan sepenuhnya -->
  <style>
    body { display: none; }
  </style>
</head>
<body>
  <!-- Firebase Core -->
  <script type="module" src="/assets/js/modules/firebase-core.js"></script>
  <!-- Unified Cart -->
  <script type="module" src="/assets/js/modules/unified-cart.js"></script>
  
  <script type="module">
    import { getFirebase } from '/assets/js/modules/firebase-core.js';
    import { CartManager, WishlistManager } from '/assets/js/modules/unified-cart.js';
    import { AuthManager } from '/assets/js/modules/unified-auth.js';

    let allowedOrigins = [
      'https://sisitus.com',
      'https://www.sisitus.com',
      'http://localhost:3000',
      'http://127.0.0.1:5500',
      window.location.origin
    ];

    async function init() {
      try {
        const { auth } = await getFirebase();
        
        window.addEventListener('message', async (event) => {
          // 1. Validasi Origin
          if (!allowedOrigins.some(origin => event.origin.startsWith(origin))) {
            return;
          }

          const { type, payload } = event.data;

          if (type === 'SSO_REQUEST_SYNC') {
            // Check session via AuthManager instead of raw firebase to ensure metadata consistency
            const currentUser = AuthManager.getCurrentUser();
            
            const cartData = CartManager.getCart();
            const wishlistData = WishlistManager.getWishlist();

            event.source.postMessage({
              type: 'SSO_SYNC_RESPONSE',
              payload: {
                user: currentUser,
                cart: cartData,
                wishlist: wishlistData
              }
            }, event.origin);
          }
          
          if (type === 'SSO_UPDATE_DATA') {
            if (payload.cart) CartManager.mergeCart(payload.cart);
            if (payload.wishlist) WishlistManager.mergeWishlist(payload.wishlist);
            
            event.source.postMessage({
              type: 'SSO_UPDATE_SUCCESS'
            }, event.origin);
          }
        });
        
        // Beri tahu parent bahwa iframe hub sudah siap menerima pesan
        window.parent.postMessage({ type: 'SSO_HUB_READY' }, '*');
        
      } catch (err) {
        console.error('[SSO Hub] Init error:', err);
      }
    }

    init();
  </script>
</body>
</html>
