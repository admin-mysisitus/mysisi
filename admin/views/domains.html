<div class="admin-page-header">
<div>
<h1 class="admin-page-title">Harga Domain</h1>
<p class="admin-page-desc">Kelola harga ekstensi domain, status promo, dan highlight.</p>
</div>
<div class="admin-actions">
<button class="admin-btn" id="btn-add-domain">
<i class="ph ph-plus"></i> Tambah Ekstensi
</button>
</div>
</div>
<div class="product-grid" id="domains-grid">
</div>
<div id="domain-modal" class="admin-modal">
<div class="admin-card admin-modal-content">
<h3 id="domain-modal-title" class="admin-section-title">Tambah Ekstensi Domain</h3>
<form id="domain-form">
<div class="admin-form-grid-2">
<div class="admin-form-group">
<label class="admin-form-label">Ekstensi Domain (contoh: .com)</label>
<input type="text" id="domain-ext" required class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Highlight Status</label>
<select id="domain-highlight" class="admin-input-control">
<option value="none">Normal (Tidak ada)</option>
<option value="best">Best (Terpopuler)</option>
<option value="business">Business (Bisnis)</option>
<option value="cheap">Cheap (Super Hemat)</option>
</select>
</div>
</div>
<div class="admin-form-grid-2">
<div class="admin-form-group">
<label class="admin-form-label">Urutan Tampil (0 = Paling Awal)</label>
<input type="number" id="domain-order" min="0" value="99" class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Harga Normal / Coret (Rp)</label>
<input type="number" id="domain-oldprice" min="0" class="admin-input-control">
</div>
</div>
<div class="admin-form-grid-2">
<div class="admin-form-group">
<label class="admin-form-label">Harga Pendaftaran (Rp)</label>
<input type="number" id="domain-registration" required min="0" class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Harga Perpanjangan (Rp)</label>
<input type="number" id="domain-renewal" required min="0" class="admin-input-control">
</div>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Keterangan Singkat (contoh: Ideal untuk bisnis global)</label>
<input type="text" id="domain-info" class="admin-input-control">
</div>
<div class="admin-form-grid-2">
<div class="admin-form-group">
<label class="admin-form-label">Label Badge (Opsional)</label>
<input type="text" id="domain-label" class="admin-input-control" placeholder="Terpopuler">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Warna Utama</label>
<input type="color" id="domain-color" value="#2563eb" class="admin-input-color">
</div>
</div>
<div class="admin-actions flex-end">
<button type="button" id="btn-close-domain" class="admin-btn btn-secondary">Batal</button>
<button type="submit" id="btn-save-domain" class="admin-btn"><i class="ph ph-floppy-disk"></i> Simpan</button>
</div>
</form>
</div>
</div>
