<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISITUS - Admin Control Panel</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico?v=1.0.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=1.0.0">
  <link rel="stylesheet" href="/admin/styles/admin-main.css?v=1.0.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js" defer></script>
</head>

<body class="admin-body dark-theme">
  <div id="admin-app" class="admin-layout">
    <div id="admin-sidebar" class="admin-sidebar glass-panel"></div>
    <div id="admin-sidebar-overlay" class="admin-sidebar-overlay"></div>
    <div class="admin-wrapper">
      <div id="admin-navbar" class="admin-navbar glass-panel"></div>
      <div id="admin-content" class="admin-main-content">
        <div class="admin-loading-state">
          <div class="admin-spinner"></div>
          <p>Memuat Sistem...</p>
        </div>
      </div>
    </div>
  </div>
  <div id="admin-loading-overlay" class="admin-overlay" style="display: none;">
    <div class="admin-spinner-large"></div>
  </div>
  <link media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <noscript>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  </noscript>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="/admin/js/admin-app.js?v=1.0.0"></script>
</body>

</html>
