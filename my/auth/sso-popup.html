<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Memproses Otentikasi...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status-text">Memproses login aman...</p>

  <script type="module">
    import { AuthManager } from '/assets/js/modules/unified-auth.js';
    import APIClient from '/assets/js/modules/unified-api.js';

    // Beri tahu opener bahwa popup siap menerima kredensial
    if (window.opener) {
      window.opener.postMessage({ type: 'SISITUS_POPUP_READY' }, '*');
    }

    // Dengarkan perintah otentikasi dari opener
    window.addEventListener('message', (event) => {
      const allowedOrigins = ['https://sisitus.com', 'http://localhost:5500', 'http://127.0.0.1:5500'];
      if (!allowedOrigins.includes(event.origin)) return;

      if (event.data && event.data.type === 'SISITUS_DELEGATE_AUTH') {
        const { action, payload } = event.data;
        const opener = window.opener;

        (async () => {
          try {
            let result;
            if (action === 'login') {
              result = await APIClient.loginUser(payload.email, payload.password);
            } else if (action === 'register') {
              result = await APIClient.registerUser(payload.email, payload.password, payload.displayName, payload.whatsapp);
            } else {
              throw new Error('Tindakan tidak valid');
            }

            if (result.success && result.data) {
              // Sesi sukses dibuat di my.sisitus.com (Top-Level karena popup)
              AuthManager.saveSession(result.data);
              
              if (opener) {
                opener.postMessage({
                  type: 'SISITUS_DELEGATE_SUCCESS',
                  action: action,
                  success: true,
                  userData: result.data
                }, event.origin);
              }
              window.close();
            } else {
              throw new Error(result.message || 'Login gagal', { cause: result.rateLimit });
            }
          } catch (error) {
            document.getElementById('status-text').textContent = 'Gagal memproses otentikasi. Jendela ini akan tertutup.';
            document.getElementById('status-text').style.color = '#ef4444';
            if (opener) {
              opener.postMessage({
                type: 'SISITUS_DELEGATE_SUCCESS',
                action: action,
                success: false,
                message: error.message,
                rateLimit: error.cause || null
              }, event.origin);
            }
            setTimeout(() => window.close(), 1500);
          }
        })();
      }
    });

    // Inisialisasi Firebase & API Client
    AuthManager.init();
    
    // Keamanan ekstra: Tutup jika dibiarkan menggantung
    setTimeout(() => {
      if (!window.closed) window.close();
    }, 15000);
  </script>
</body>
</html>
