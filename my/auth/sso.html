<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>SSO Provider - SISITUS</title>
</head>

<body>
  <script type="module">
    import { AuthManager } from '/assets/js/modules/unified-auth.js';
    import { CartManager, WishlistManager } from '/assets/js/modules/unified-cart.js';
    import APIClient from '/assets/js/modules/unified-api.js';
    
    // Origin whitelist strict
    const allowedOrigins = ['https://sisitus.com', 'http://localhost:5500', 'http://127.0.0.1:5500'];
    const trustedClients = new Map(); // Menyimpan source -> origin untuk broadcast
    
    const getCartCount = () => {
      try {
        const cart = CartManager.getCart();
        return (cart && cart.domains) ? cart.domains.length : 0;
      } catch(e) {}
      return 0;
    };
    
    const getWishlistDomains = () => {
      try {
        const wishlist = WishlistManager.getWishlist();
        return wishlist.domains.map(d => d.domain.toLowerCase());
      } catch(e) {}
      return [];
    };
    
    const broadcastState = () => {
      const user = AuthManager.getCurrentUser();
    
      // Filter payload agar hanya mengirim data visual minimal (tanpa token, credential, uid)
      const payload = {
        type: 'SISITUS_SSO_STATE',
        isLoggedIn: !!user,
        user: user ? {
          displayName: user.displayName,
          email: user.email,
          photoURL: user.photoURL,
          role: user.role
        } : null,
        // Jika guest, jangan kirim cart/wishlist (biarkan public site pakai storage lokalnya sendiri)
        cartCount: user ? getCartCount() : undefined,
        wishlistDomains: user ? getWishlistDomains() : undefined
      };
    
      // Kirim hanya ke client yang sudah terverifikasi lewat handshake
      trustedClients.forEach((origin, source) => {
        try {
          source.postMessage(payload, origin);
        } catch(e) {}
      });
    };
    
    // Dengarkan request dari parent window (Handshake Protocol)
    window.addEventListener('message', (event) => {
      if (!allowedOrigins.includes(event.origin)) return;
    
      if (event.data && event.data.type === 'SISITUS_SSO_REQUEST') {
        trustedClients.set(event.source, event.origin);
        broadcastState(); // Kirim state saat ini juga
      }
    
      // Handoff Protocol: Terima guest cart dan balas dengan ACK jika sukses
      if (event.data && event.data.type === 'SISITUS_GUEST_HANDOFF') {
        if (!AuthManager.isLoggedIn()) {
          try {
            let saved = false;
            if (event.data.cart) {
              CartManager.saveCart(event.data.cart);
              saved = true;
            }
            if (event.data.wishlist) {
              WishlistManager.saveWishlist(event.data.wishlist);
              saved = true;
            }
    
            // Hanya kirim ACK jika penyimpanan berhasil dan memang Guest
            if (saved && event.source) {
              event.source.postMessage({ type: 'SISITUS_GUEST_HANDOFF_ACK' }, event.origin);
            }
          } catch(e) {
            void('[SSO] Gagal menyimpan Handoff:', e);
          }
        }
      }
    
      // Handoff Protocol: Delegated Wishlist Action
      if (event.data && event.data.type === 'SISITUS_DELEGATE_WISHLIST_TOGGLE') {
        if (event.data.domain) {
          const domain = event.data.domain;
          if (WishlistManager.isInWishlist(domain)) {
            WishlistManager.remove(domain);
          } else {
            WishlistManager.add(domain, 'Domain impian dari public', 'medium', { delegated: true });
          }
        }
      }
    });
    
    // Dengarkan perubahan state autentikasi internal (dari Firebase via AuthManager)
    document.addEventListener('auth:authChanged', () => {
      broadcastState();
    });
    
    window.addEventListener('wishlist:updated', () => {
      broadcastState();
    });
    
    // Dengarkan perubahan storage murni (sinkronisasi cart lintas tab dashboard)
    window.addEventListener('storage', (e) => {
      if (e.key === 'cart' || e.key === 'wishlist') {
        broadcastState();
      }
    });
    
    // Inisialisasi AuthManager
    AuthManager.init();
  </script>
</body>

</html>
