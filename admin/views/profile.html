<div class="admin-page-header">
  <div>
    <h1 class="admin-page-title">Profil Admin</h1>
    <p class="admin-page-desc">Perbarui detail profil akun Anda dan ganti kata sandi.</p>
  </div>
</div>
<div class="admin-card">
  <div class="card-body">
    <!-- Edit Profile Form -->
    <h3 style="margin-top:0;">Informasi Akun</h3>
    <form id="form-edit-profile">
      <div class="admin-form-group">
        <label class="admin-form-label">Nama Lengkap</label>
        <input type="text" id="input-name" class="admin-input-control" required>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label">Foto Profil</label>
        <div style="display: flex; align-items: center; gap: 15px;">
          <div id="photo-preview-container" style="width: 60px; height: 60px; border-radius: 50%; background: var(--admin-border); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <img id="photo-preview" src="" alt="Preview" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <i id="photo-placeholder" class="fas fa-user" style="font-size: 24px; color: var(--admin-text-muted);"></i>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <input type="file" id="input-photo" accept="image/png, image/jpeg, image/jpg" style="display: none;">
              <label for="input-photo" class="admin-btn" style="background: var(--admin-surface-hover); color: var(--admin-text-main); border: 1px solid var(--admin-border); cursor: pointer; padding: 8px 16px; font-size: 0.85rem; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; margin: 0;">
                <i class="fas fa-camera"></i> Pilih Foto Baru </label>
              <span id="file-name-display" style="font-size: 0.8rem; color: var(--admin-text-muted); display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;"></span>
            </div>
            <small style="color: var(--admin-text-muted); font-size: 0.8rem; line-height: 1.4; margin: 0;">Format: JPG, PNG. Maksimal 2MB.</small>
          </div>
        </div>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label">Nomor WhatsApp</label>
        <input type="tel" id="input-whatsapp" class="admin-input-control" placeholder="08xxxxxxxxxx">
      </div>
      <button type="submit" class="admin-btn admin-btn-primary" style="padding: 10px 20px;">Simpan Profil</button>
    </form>
    <hr style="margin: 30px 0; border: none; border-top: 1px solid var(--admin-border);">
    <!-- Change Password Form -->
    <h3 style="margin-top:0;">Ubah Password</h3>
    <form id="form-change-password">
      <div class="admin-form-group">
        <label class="admin-form-label">Password Lama</label>
        <div style="position: relative;">
          <input type="password" id="input-old-password" class="admin-input-control" style="padding-right: 40px;" required autocomplete="current-password">
          <button type="button" class="toggle-password-btn" data-target="input-old-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--admin-text-muted); cursor: pointer; padding: 5px;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label">Password Baru</label>
        <div style="position: relative;">
          <input type="password" id="input-new-password" class="admin-input-control" style="padding-right: 40px;" required autocomplete="new-password">
          <button type="button" class="toggle-password-btn" data-target="input-new-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--admin-text-muted); cursor: pointer; padding: 5px;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="password-strength" id="admin-password-strength" style="display: none; margin-top: 8px;">
          <div class="strength-meter" style="width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; margin-bottom: 5px; overflow: hidden;">
            <div class="strength-bar" id="admin-strength-bar" style="height: 100%; width: 0%; transition: all 0.3s; border-radius: 2px;"></div>
          </div>
          <div class="strength-text" id="admin-strength-text" style="font-size: 11px; color: var(--admin-text-muted);"></div>
        </div>
        <small style="color: var(--admin-text-muted); font-size: 0.8rem; display: block; margin-top: 5px;">Minimal 8 karakter</small>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label">Konfirmasi Password</label>
        <div style="position: relative;">
          <input type="password" id="input-confirm-password" class="admin-input-control" style="padding-right: 40px;" required autocomplete="new-password">
          <button type="button" class="toggle-password-btn" data-target="input-confirm-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--admin-text-muted); cursor: pointer; padding: 5px;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary" style="padding: 10px 20px;">Ubah Password</button>
    </form>
  </div>
</div>
