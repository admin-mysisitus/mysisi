<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Rapor SD Muhammadiyah</title>
    <style>
        @page {
            size: 210mm 330mm;
            margin: 10mm 12mm;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Arial', sans-serif;
            font-size: 9.5pt;
            color: #000;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .page {
            width: 210mm;
            min-height: 330mm;
            padding: 12mm;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
            page-break-inside: auto;
        }

        tr {
            page-break-inside: avoid;
            page-break-after: auto;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 4px 6px;
            font-size: 9pt;
            vertical-align: middle;
        }

        .identity-table {
            margin-bottom: 12px;
        }

        .identity-table td {
            border: none;
            padding: 2px 4px;
            vertical-align: top;
            font-size: 9.5pt;
        }

        table.data-table th {
            background-color: #b0b0b0 !important;
            color: #000;
            font-weight: bold;
            text-align: center;
            font-size: 9.5pt;
        }

        .sub-subject td:nth-child(1) {
            padding-left: 12px;
            color: #333333;
        }

        .capaian-box p {
            margin: 0;
            padding: 2px 0;
            line-height: 1.25;
        }

        .capaian-box p:first-child {
            margin-bottom: 2px;
            padding-bottom: 3px;
            border-bottom: 1px dashed #aaa;
        }

        .section-header {
            background-color: #b0b0b0 !important;
            font-weight: bold;
            text-align: center;
            border: 1px solid #000;
            padding: 4px;
            font-size: 9.5pt;
            page-break-after: avoid;
            page-break-inside: avoid;
        }

        .content-box {
            border: 1px solid #000;
            border-top: none;
            padding: 6px;
            min-height: 35px;
            font-size: 9pt;
            margin-bottom: 12px;
            page-break-inside: avoid;
        }

        .text-center {
            text-align: center;
        }

        .flex-row {
            display: table;
            width: 100%;
            margin-bottom: 12px;
            page-break-inside: avoid;
        }

        .flex-col-left {
            display: table-cell;
            width: 45%;
            vertical-align: top;
            padding-right: 8px;
        }

        .flex-col-right {
            display: table-cell;
            width: 55%;
            vertical-align: top;
            padding-left: 8px;
        }

        .attendance-table {
            margin-bottom: 0;
        }

        .attendance-table th {
            background-color: #b0b0b0 !important;
            color: #000;
            font-weight: bold;
            text-align: center;
            font-size: 9.5pt;
            padding: 4px;
        }

        .attendance-table td {
            padding: 5px 6px;
        }

        .signature-table {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 0;
            border-collapse: collapse;
            page-break-inside: avoid;
        }

        .signature-table td {
            border: none;
            text-align: center;
            vertical-align: top;
            width: 33.33%;
            font-size: 9pt;
            padding: 0;
        }

        .signature-space {
            height: 50px;
        }

        .print-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn-action {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-family: inherit;
        }

        .btn-action:hover {
            background-color: #1b5e20;
        }

        .btn-close {
            background-color: #64748b;
        }

        .btn-close:hover {
            background-color: #475569;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body {
                background-color: #fff;
                padding: 0;
            }

            .page {
                box-shadow: none;
                margin: 0;
                padding: 0;
                width: 100%;
            }

            .print-actions {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div id="print-container">
        <p style="text-align:center; padding:50px;">Memuat data rapor...</p>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/print.js"></script>
</body>

</html>
