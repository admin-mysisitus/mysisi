<div class="admin-page-header">
<div>
<h1 class="admin-page-title">Profil Admin</h1>
<p class="admin-page-desc">Perbarui detail profil akun Anda dan ganti kata sandi.</p>
</div>
</div>
<div class="admin-layout-grid-2">
<div class="admin-card">
<h3 class="admin-section-title">Informasi Akun</h3>
<form id="form-edit-profile">
<div class="admin-form-group">
<label class="admin-form-label">Nama Lengkap</label>
<input type="text" id="input-name" class="admin-input-control" required>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Foto Profil</label>
<div class="profile-avatar-row">
<div id="photo-preview-container" class="profile-avatar-preview">
<img id="photo-preview" src="" alt="Preview" class="profile-avatar-img">
<i id="photo-placeholder" class="ph ph-user profile-avatar-placeholder"></i>
</div>
<div>
<div class="btn-group">
<input type="file" id="input-photo" accept="image/png, image/jpeg, image/jpg" class="sr-only">
<label for="input-photo" class="admin-btn btn-secondary cursor-pointer">
<i class="ph ph-camera"></i> Pilih Foto
</label>
<span id="file-name-display" class="profile-file-name"></span>
</div>
<small class="text-muted text-xs">JPG, PNG maks 2MB.</small>
</div>
</div>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Nomor WhatsApp</label>
<input type="tel" id="input-whatsapp" class="admin-input-control" placeholder="08xxxxxxxxxx">
</div>
<button type="submit" class="admin-btn"><i class="ph ph-floppy-disk"></i> Simpan Profil</button>
</form>
</div>
<div class="admin-card">
<h3 class="admin-section-title">Ubah Password</h3>
<form id="form-change-password">
<div class="admin-form-group">
<label class="admin-form-label">Password Lama</label>
<div class="password-input-wrap">
<input type="password" id="input-old-password" class="admin-input-control" required autocomplete="current-password">
<button type="button" class="toggle-password-btn" data-target="input-old-password">
<i class="ph ph-eye"></i>
</button>
</div>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Password Baru</label>
<div class="password-input-wrap">
<input type="password" id="input-new-password" class="admin-input-control" required autocomplete="new-password">
<button type="button" class="toggle-password-btn" data-target="input-new-password">
<i class="ph ph-eye"></i>
</button>
</div>
<div class="password-strength" id="admin-password-strength">
<div class="strength-meter">
<div class="strength-bar" id="admin-strength-bar"></div>
</div>
<div class="strength-text" id="admin-strength-text"></div>
</div>
<small class="text-muted text-xs">Minimal 8 karakter</small>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Konfirmasi Password Baru</label>
<div class="password-input-wrap">
<input type="password" id="input-confirm-password" class="admin-input-control" required autocomplete="new-password">
<button type="button" class="toggle-password-btn" data-target="input-confirm-password">
<i class="ph ph-eye"></i>
</button>
</div>
</div>
<button type="submit" class="admin-btn"><i class="ph ph-lock-key"></i> Ubah Password</button>
</form>
</div>
</div>
