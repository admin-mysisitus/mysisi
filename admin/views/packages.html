<div class="admin-page-header">
<div>
<h1 class="admin-page-title">Paket & Layanan</h1>
<p class="admin-page-desc">Kelola penawaran produk, harga, dan fitur paket.</p>
</div>
<div class="admin-actions">
<button class="admin-btn" id="btn-add-package">
<i class="ph ph-plus"></i> Tambah Paket
</button>
</div>
</div>
<div class="product-grid" id="packages-grid">
</div>
<div id="package-modal" class="admin-modal">
<div class="admin-card admin-modal-content">
<h3 id="package-modal-title" class="admin-section-title">Buat Paket Baru</h3>
<form id="package-form">
<div class="admin-form-grid-2">
<div class="admin-form-group">
<label class="admin-form-label">Package ID (Tanpa spasi)</label>
<input type="text" id="pkg-id" required class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Nama Paket</label>
<input type="text" id="pkg-name" required class="admin-input-control">
</div>
</div>
<div class="admin-form-grid-3">
<div class="admin-form-group">
<label class="admin-form-label">Harga (Rp)</label>
<input type="number" id="pkg-price" required min="0" class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Periode (Tahun)</label>
<input type="number" id="pkg-periodValue" required min="1" value="1" class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Urutan (Order)</label>
<input type="number" id="pkg-order" required min="0" value="99" class="admin-input-control">
</div>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Deskripsi Singkat</label>
<textarea id="pkg-description" rows="2" class="admin-input-control"></textarea>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Daftar Fitur (Gunakan baris baru/Enter untuk setiap fitur)</label>
<textarea id="pkg-features" rows="5" class="admin-input-control" placeholder="Domain Gratis&#10;Hosting SSD&#10;Support 24/7"></textarea>
</div>
<div class="admin-form-group">
<label class="checkbox-label">
<input type="checkbox" id="pkg-active" checked>
<span>Paket Aktif</span>
</label>
</div>
<div class="admin-actions flex-end">
<button type="button" id="btn-close-package" class="admin-btn btn-secondary">Batal</button>
<button type="submit" id="btn-save-package" class="admin-btn"><i class="ph ph-floppy-disk"></i> Simpan</button>
</div>
</form>
</div>
</div>
