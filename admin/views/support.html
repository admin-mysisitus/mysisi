<div class="admin-page-header">
<div>
<h1 class="admin-page-title">Support Tickets</h1>
<p class="admin-page-desc">Tanggapi pertanyaan dan keluhan teknis dari pengguna.</p>
</div>
<div class="admin-actions">
<button class="admin-btn" id="btn-add-ticket">
<i class="ph ph-plus"></i> Buat Tiket Manual
</button>
</div>
</div>
<div class="admin-support-grid">
<div class="admin-card p-0 flex flex-col overflow-hidden">
<div class="support-search-wrap">
<div class="admin-search-box">
<i class="ph ph-magnifying-glass"></i>
<input type="text" id="search-ticket" placeholder="Cari tiket...">
</div>
</div>
<div class="support-list-wrap" id="ticket-list">
</div>
</div>
<div class="admin-card p-0 flex flex-col overflow-hidden">
<div class="support-panel-header">
<h3 class="support-panel-title">Detail Percakapan</h3>
<span class="status-pill status-pill--info" id="ticket-detail-status">Pilih Tiket</span>
</div>
<div class="support-empty-state" id="ticket-detail-body">
<i class="ph ph-chats-circle support-empty-icon"></i>
<p class="support-empty-text">Pilih tiket di sebelah kiri untuk melihat pesan dan memberikan tanggapan.</p>
</div>
</div>
</div>
<div id="ticket-modal" class="admin-modal">
<div class="admin-modal-content">
<h3 id="ticket-modal-title" class="admin-page-title">Buat Tiket Baru</h3>
<form id="ticket-form">
<input type="hidden" id="tck-id">
<div class="admin-form-group">
<label class="admin-form-label">Subjek Tiket</label>
<input type="text" id="tck-subject" required class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Nama Pengguna / Email</label>
<input type="text" id="tck-user" required class="admin-input-control">
</div>
<div class="admin-form-grid-2">
<div class="admin-form-group">
<label class="admin-form-label">Prioritas</label>
<select id="tck-priority" class="admin-filter-select w-full">
<option value="low">Rendah (Low)</option>
<option value="medium" selected>Sedang (Medium)</option>
<option value="high">Tinggi (High)</option>
</select>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Status</label>
<select id="tck-status" class="admin-filter-select w-full">
<option value="open" selected>Open</option>
<option value="pending">Pending</option>
<option value="closed">Closed</option>
</select>
</div>
</div>
<div class="admin-actions flex-end">
<button type="button" id="btn-close-ticket" class="admin-btn btn-secondary">Batal</button>
<button type="submit" id="btn-save-ticket" class="admin-btn"><i class="ph ph-floppy-disk"></i> Simpan</button>
</div>
</form>
</div>
</div>
