<div class="admin-page-header">
<div>
<h1 class="admin-page-title">Layanan Ekstra (Addons)</h1>
<p class="admin-page-desc">Kelola layanan tambahan yang bisa dibeli bersama paket.</p>
</div>
<div class="admin-actions">
<button class="admin-btn" id="btn-add-addon">
<i class="ph ph-plus"></i> Tambah Addon
</button>
</div>
</div>
<div class="product-grid" id="addons-grid">
</div>
<div id="addon-modal" class="admin-modal">
<div class="admin-card admin-modal-content">
<h3 id="addon-modal-title" class="admin-section-title">Tambah Addon Baru</h3>
<form id="addon-form">
<div class="admin-form-grid-2">
<div class="admin-form-group">
<label class="admin-form-label">Addon ID (Tanpa spasi)</label>
<input type="text" id="addon-id" required class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Nama Layanan</label>
<input type="text" id="addon-name" required class="admin-input-control">
</div>
</div>
<div class="admin-form-group">
<label class="admin-form-label">Deskripsi Singkat</label>
<textarea id="addon-description" rows="3" required class="admin-input-control"></textarea>
</div>
<div class="admin-form-grid-3">
<div class="admin-form-group">
<label class="admin-form-label">Harga (Rp)</label>
<input type="number" id="addon-price" required min="0" class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Durasi (Tahun)</label>
<input type="number" id="addon-duration" required min="1" value="1" class="admin-input-control">
</div>
<div class="admin-form-group">
<label class="admin-form-label">Urutan (Order)</label>
<input type="number" id="addon-order" required min="0" value="99" class="admin-input-control">
</div>
</div>
<div class="admin-form-group">
<label class="checkbox-label">
<input type="checkbox" id="addon-recommended">
<span>Rekomendasikan (Highlight)</span>
</label>
</div>
<div class="admin-actions flex-end">
<button type="button" id="btn-close-addon" class="admin-btn btn-secondary">Batal</button>
<button type="submit" id="btn-save-addon" class="admin-btn"><i class="ph ph-floppy-disk"></i> Simpan</button>
</div>
</form>
</div>
</div>
