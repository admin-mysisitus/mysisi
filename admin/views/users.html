<div class="admin-page-header">
  <div>
    <h1 class="admin-page-title">Manajemen Users</h1>
    <p class="admin-page-desc">Kelola akun pelanggan dan akses admin.</p>
  </div>
  <div>
    <button class="admin-btn" id="btn-add-user">
      <i class="fas fa-plus"></i> Tambah User </button>
  </div>
</div>
<div class="admin-card">
  <!-- Toolbar -->
  <div class="admin-toolbar">
    <div class="admin-search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="search-users" placeholder="Cari nama atau email...">
    </div>
    <div class="admin-filter-group">
      <select id="filter-user-status" class="admin-filter-select">
        <option value="all">Semua Status</option>
        <option value="active">Aktif</option>
        <option value="suspended">Suspended</option>
      </select>
      <button class="admin-btn" style="background: var(--admin-surface-hover); color: var(--admin-text-main);">
        <i class="fas fa-filter"></i> Filter
      </button>
    </div>
  </div>
  <!-- Table -->
  <div class="admin-table-container">
    <table class="admin-table">
      <thead>
        <tr>
          <th>User Info</th>
          <th>Role</th>
          <th>Status</th>
          <th>Bergabung</th>
          <th style="text-align: right;">Aksi</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <!-- Data will be injected here via JS -->
      </tbody>
    </table>
  </div>
  <!-- Pagination -->
  <div class="admin-pagination">
    <p class="admin-pagination-text">Menampilkan 1-5 dari 1,248 user</p>
    <div class="admin-pagination-controls">
      <button class="admin-btn" style="background: var(--admin-surface-hover); color: var(--admin-text-muted); padding: 6px 12px;" disabled>
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="admin-btn" style="background: var(--admin-primary); padding: 6px 12px;">1</button>
      <button class="admin-btn" style="background: var(--admin-surface-hover); color: var(--admin-text-main); padding: 6px 12px;">2</button>
      <button class="admin-btn" style="background: var(--admin-surface-hover); color: var(--admin-text-main); padding: 6px 12px;">3</button>
      <button class="admin-btn" style="background: var(--admin-surface-hover); color: var(--admin-text-main); padding: 6px 12px;">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
<!-- Modal Form User -->
<div id="user-modal" class="admin-modal">
  <div class="admin-card admin-modal-content">
    <h3 id="user-modal-title" style="margin: 0 0 20px 0;">Tambah User Baru</h3>
    <form id="user-form">
      <input type="hidden" id="usr-id">
      <div class="admin-form-group">
        <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">Nama Lengkap</label>
        <input type="text" id="usr-name" required class="admin-input-control">
      </div>
      <div class="admin-form-group">
        <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">Email</label>
        <input type="email" id="usr-email" required class="admin-input-control">
      </div>
      <div class="admin-form-grid-2">
        <div>
          <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">WhatsApp</label>
          <input type="text" id="usr-wa" class="admin-input-control">
        </div>
        <div>
          <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">Role</label>
          <select id="usr-role" class="admin-input-control" style="background: var(--admin-surface);">
            <option value="customer">Customer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="admin-form-group">
        <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--admin-text-muted);">Password (Kosongkan jika tidak ingin diubah)</label>
        <input type="password" id="usr-password" class="admin-input-control">
      </div>
      <div style="display: flex; gap: 20px; margin-bottom: 24px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="usr-active" checked style="width: 18px; height: 18px;">
          <label for="usr-active" style="font-size: 0.9rem;">Akun Aktif</label>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="usr-verified" checked style="width: 18px; height: 18px;">
          <label for="usr-verified" style="font-size: 0.9rem;">Email Verified</label>
        </div>
      </div>
      <div class="admin-actions" style="justify-content: flex-end;">
        <button type="button" id="btn-close-user" class="admin-btn" style="background: transparent; border: 1px solid var(--admin-border); color: var(--admin-text-main);">Batal</button>
        <button type="submit" id="btn-save-user" class="admin-btn"><i class="fas fa-save"></i> Simpan</button>
      </div>
    </form>
  </div>
</div>
